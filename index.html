<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viagem Itália 2027</title>
<style>
  :root {
    --bg: #faf8f5; --card: #ffffff; --ink: #1f2430; --muted: #6b7280;
    --line: #e7e2da; --accent: #b4442b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161b; --card: #1d2028; --ink: #eceef2; --muted: #9aa1ad;
      --line: #2e333d; --accent: #e8836b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .auth-box {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 32px 28px; max-width: 400px; width: 100%;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08); text-align: center;
  }
  .auth-box h1 { margin: 8px 0 4px; font-size: 1.45rem; }
  .auth-box p { margin: 0 0 20px; color: var(--muted); font-size: .9rem; }
  .auth-box input {
    width: 100%; font: inherit; font-size: 1rem; padding: 10px 14px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
    color: var(--ink); text-align: center; margin-bottom: 12px;
  }
  .auth-box input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .auth-box button {
    width: 100%; font: inherit; font-size: .98rem; font-weight: 600;
    padding: 11px; border: 0; border-radius: 8px; background: var(--accent);
    color: #fff; cursor: pointer;
  }
  .auth-err {
    color: var(--accent); font-size: .84rem; font-weight: 600;
    margin-top: 10px; display: none;
  }
</style>
</head>
<body>

    <input type="password" id="in-pass" placeholder="Senha de acesso" autocomplete="current-password" autofocus>
    <button type="submit">Entrar</button>
    <div class="auth-err" id="msg-err">Senha incorreta. Tente novamente.</div>
  </form>

  const STORAGE_PASS_KEY = "italia-aes-pass-v1";
  const AUTH_TOKEN_KEY = "italia-auth-token-v1";
  const PASS_HASH_HEX = "6462302275ab6546a1a091d957c7062e766b1f437dabe7ba888cde5ab91c8571";

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  async function tryUnlock(pass, fromStorage) {
    try {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64ToBytes(SALT_B64), iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64ToBytes(IV_B64) },
        key,
        b64ToBytes(CT_B64)
      );
      const html = new TextDecoder().decode(decrypted);
      try {
        localStorage.setItem(STORAGE_PASS_KEY, pass);
        localStorage.setItem(AUTH_TOKEN_KEY, PASS_HASH_HEX);
      } catch (e) {}
      document.open();
      document.write(html);
      document.close();
      setTimeout(() => {
        const btnOut = document.getElementById("btn-logout");
        if (btnOut) {
          btnOut.addEventListener("click", () => {
            try { localStorage.removeItem(STORAGE_PASS_KEY); } catch (e) {}
            location.reload();
          });
        }
      }, 100);
      return true;
    } catch (err) {
      if (fromStorage) {
        try { localStorage.removeItem(STORAGE_PASS_KEY); } catch (e) {}
      } else {
        document.getElementById("msg-err").style.display = "block";
      }
      return false;
    }
  }

  document.getElementById("form-unlock").addEventListener("submit", async e => {
    e.preventDefault();
    const p = document.getElementById("in-pass").value.trim();
    if (p) await tryUnlock(p, false);
  });

  try {
    const saved = localStorage.getItem(STORAGE_PASS_KEY);
    if (saved) tryUnlock(saved, true);
  } catch (e) {}
</script>
